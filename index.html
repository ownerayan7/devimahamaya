    <script>
      (function() {
        // Prevent cross-origin third-party script errors (e.g. YouTube iframe, fonts, external media) from bubbling
        window.addEventListener('error', function(event) {
          if (!event || !event.message || event.message === 'Script error.' || event.message === 'Script error') {
            if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
            if (typeof event.preventDefault === 'function') event.preventDefault();
            return true;
          }
        }, true);

        window.onerror = function(message, source, lineno, colno, error) {
          if (!message || message === 'Script error.' || message === 'Script error' || !source || source === '') {
            return true;
          }
          return false;
        };

        window.addEventListener('unhandledrejection', function(event) {
          var reason = (event && event.reason) ? String(event.reason.message || event.reason) : '';
          if (reason.indexOf('Script error') !== -1 || reason.indexOf('AbortError') !== -1 || reason.indexOf('NotAllowedError') !== -1) {
            if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
            if (typeof event.preventDefault === 'function') event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
